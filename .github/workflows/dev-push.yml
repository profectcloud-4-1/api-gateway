name: Spring-Cloud-Gateway dev-branch push CI workflow

on:
  push:
    branches: [ "dev" ]

jobs:
  build-and-deploy:
    name: Build and Deploy Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}                 # 예: ap-northeast-2
      ECR_REPOSITORY: ${{ vars.AWS_ECR_REPOSITORY }}     # 예: goorm/app-service (슬래시 가능)
      CONTAINER_NAME: ${{ vars.CONTAINER_NAME }}         # 예: goorm-app-service (슬래시 X)

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      # 1) ECR 로그인 (Runner)
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 2) REGISTRY를 env로 저장
      - name: Set registry env
        run: echo "REGISTRY=${{ steps.login-ecr.outputs.registry }}" >> "$GITHUB_ENV"

      # 3) Docker meta (이미지/태그 생성 규칙)
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}
          tags: |
            # sha 태그 하나 (예: 9c1a3b2)
            type=sha,format=short

      # 4) IMAGE_NAME 환경변수로 내보내기
      - name: Export image info
        run: |
          # 첫 번째 태그만 사용 (형태: REGISTRY/REPO:TAG)
          IMAGE="$(echo "${{ steps.meta.outputs.tags }}" | head -n 1)"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      # 5) Build & Push to ECR
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # 6) Deploy
      - name: Deploy via SSH to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          # 이 envs에 적은 것만 EC2 쪽으로 넘어감
          envs: IMAGE,REGISTRY,AWS_REGION
          script: |
            # 에러 나면 바로 실패
            set -Eeuo pipefail

            echo "== ECR 로그인 (EC2) =="
            aws ecr get-login-password --region "$AWS_REGION" \
              | docker login --username AWS --password-stdin "$REGISTRY"

            echo "== 최신 이미지 pull =="
            docker pull "$IMAGE" 

            echo "== 새 컨테이너 실행 =="
            docker-compose up -d --force-recreate api-gateway

            echo "배포 완료"

      - name: Wait for server restart (health check)
        env:
          GATEWAY_HEALTH_URL: ${{ secrets.HEALTH_URL }}
        run: |
          echo "🔄 Waiting for API Gateway to restart..."
          for i in {1..30}; do
            if curl -s --head "$GATEWAY_HEALTH_URL" | grep "200 OK" > /dev/null; then
              echo "✅ Server is back online!"
              exit 0
            fi
            echo "⏳ Attempt $i: not ready yet... retrying in 10s"
            sleep 10
          done
          echo "❌ Server did not respond within 5 minutes."
          exit 1

  api-test:
    env:
      POSTMAN_COLLECTION_ID: ${{ secrets.POSTMAN_COLLECTION_ID }}
      POSTMAN_ENV_ID: ${{ secrets.POSTMAN_ENV_ID }}
      POSTMAN_API_KEY: ${{ secrets.POSTMAN_API_KEY }}

    name: Setup Newman Test Environment
    runs-on: ubuntu-latest
    needs: build-and-deploy
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Newman
        run: npm install -g newman newman-reporter-htmlextra

      - name: Verify Newman installation
        run: newman --version

      - name: Run Newman tests
        run: |
          mkdir -p ./build/reports
          newman run "https://api.getpostman.com/collections/${POSTMAN_COLLECTION_ID}?apikey=${POSTMAN_API_KEY}" \
            -e "https://api.getpostman.com/environments/${POSTMAN_ENV_ID}?apikey=${POSTMAN_API_KEY}" \
            -r htmlextra \
            --reporter-htmlextra-export build/newman/reports/report.html \
            --reporter-htmlextra-title "Dev server Spring Gateway Test Report"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_S3_UPLOAD }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_S3_UPLOAD }}
          aws-region: ap-northeast-2

      - name: Upload test report to S3
        run: |
          if [ -d "build/newman/reports/" ]; then
            aws s3 cp build/newman/reports/report.html \
              "s3://${{ secrets.S3_REPORT_BUCKET }}/reports/${RUN_ID}/report.html" \
              --content-type text/html
          else
            echo "No test report directory found."
          fi

  notify-slack-after-api-test:
    name: Notify Slack after api tests
    needs:
      - api-test
    runs-on: ubuntu-latest
    steps:
      - name: Send Slack message after api test
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          CF_DOMAIN: ${{ vars.CF_REPORT_DOMAIN }}
        run: |
          REPO="${GITHUB_REPOSITORY}"
          BRANCH_FROM="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"   # PR일 경우: from 브랜치
          BRANCH_TO="${GITHUB_BASE_REF:-main}"                   # PR일 경우: target 브랜치
          RUN_ID="${GITHUB_RUN_ID}"
          GH_URL="https://github.com/${REPO}/actions/runs/${RUN_ID}"
          REPORT_URL="https://${CF_DOMAIN}/reports/${RUN_ID}/reports.html"

          MESSAGE="The result of Api test 📄*

          *Repository* : \`${REPO}\`
          *Branch* : \`${BRANCH_FROM}\` → \`${BRANCH_TO}\`

          *GitHub Run*: <${GH_URL}|View in GitHub>
          *Report* : <${REPORT_URL}|View HTML Report>"

          payload=$(jq -n --arg text "$MESSAGE" '{ text: $text }')

          curl -X POST -H 'Content-type: application/json' \
            --data "$payload" \
            "$SLACK_WEBHOOK_URL"
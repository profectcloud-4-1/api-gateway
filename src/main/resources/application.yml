spring:
  application:
    name: api-gateway
  profiles:
    active: dev

  cloud:
    gateway:
      routes:
        - id: product-service
          uri: http://product-service:8080
          predicates:
            - Path=/api/v1/product/**,/api/v1/category/**,/api/v1/stock/**,/api/files/**,/api/v1/reviews/**

        - id: order-service
          uri: http://order-service:8080
          predicates:
            - Path=/api/v1/orders/**,/api/v1/carts/**,/api/v1/delivery/**

        - id: user-service
          uri: http://user-service:8080
          predicates:
            - Path=/api/v1/users/**

        - id: payment-service
          uri: http://payment-service:8080
          predicates:
            - Path=/api/v1/payments/**

        # dev용 내부 라우트 (actuator, swagger 등)
        - id: user-service-dev
          uri: http://user-service:8080
          predicates:
            - Path=/user-service/**
          filters:
            - StripPrefix=1

        - id: order-service-dev
          uri: http://order-service:8080
          predicates:
            - Path=/order-service/**
          filters:
            - StripPrefix=1

        - id: product-service-dev
          uri: http://product-service:8080
          predicates:
            - Path=/product-service/**
          filters:
            - StripPrefix=1

        - id: payment-service-dev
          uri: http://payment-service:8080
          predicates:
            - Path=/payment-service/**
          filters:
            - StripPrefix=1

spring:
  application:
    name: api-gateway
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: product-service
              uri: ${PRODUCT_SERVICE_URL}
              predicates:
                - Path=/api/v1/product/**,/api/v1/category/**,/api/v1/stock/**,/api/files/**,/api/v1/reviews/**

            - id: order-service
              uri: ${ORDER_SERVICE_URL}
              predicates:
                - Path=/api/v1/orders/**,/api/v1/carts/**,/api/v1/delivery/**

            - id: user-service
              uri: ${USER_SERVICE_URL}
              predicates:
                - Path=/api/v1/users/**

            - id: payment-service
              uri: ${PAYMENT_SERVICE_URL}
              predicates:
                - Path=/api/v1/payments/**

            # dev용 내부 라우트
            - id: user-service-dev
              uri: http://user-service:8080
              predicates:
                - Path=/user-service/**
              filters:
                - StripPrefix=1

            - id: order-service-dev
              uri: http://order-service:8080
              predicates:
                - Path=/order-service/**
              filters:
                - StripPrefix=1

            - id: product-service-dev
              uri: http://product-service:8080
              predicates:
                - Path=/product-service/**
              filters:
                - StripPrefix=1

            - id: payment-service-dev
              uri: http://payment-service:8080
              predicates:
                - Path=/payment-service/**
              filters:
                - StripPrefix=1

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      show-details: never
